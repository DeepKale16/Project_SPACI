<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="spaciCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9E3FF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="spaciAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FF9100"/>
    </linearGradient>
    <filter id="spaciGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Logo Mark (Left 0..80) -->
  <g transform="translate(10, 8)">
    <!-- Outer Orbital Ring -->
    <ellipse cx="32" cy="32" rx="28" ry="12" fill="none" stroke="url(#spaciCyanGrad)" stroke-width="1.8" transform="rotate(-28, 32, 32)" stroke-dasharray="160" stroke-dashoffset="10" opacity="0.85" filter="url(#spaciGlow)"/>
    
    <!-- Ascending Orbit Satellite Node -->
    <circle cx="53" cy="20" r="3.2" fill="#00E5FF" filter="url(#spaciGlow)"/>
    <circle cx="53" cy="20" r="1.4" fill="#FFFFFF"/>

    <!-- Reticle Target Brackets (4 Corners) -->
    <path d="M 16 24 L 16 16 L 24 16" fill="none" stroke="#7FD1FF" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 48 16 L 56 16 L 56 24" fill="none" stroke="#7FD1FF" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 56 40 L 56 48 L 48 48" fill="none" stroke="#7FD1FF" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 24 48 L 16 48 L 16 40" fill="none" stroke="#7FD1FF" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Center Satellite & Net Intercept Core -->
    <rect x="27" y="27" width="10" height="10" rx="1.5" fill="#0D1B2A" stroke="url(#spaciAmberGrad)" stroke-width="1.8"/>
    <!-- Solar Panels -->
    <rect x="18" y="29.5" width="7" height="5" rx="0.5" fill="#0077B6" stroke="#00E5FF" stroke-width="0.8"/>
    <rect x="39" y="29.5" width="7" height="5" rx="0.5" fill="#0077B6" stroke="#00E5FF" stroke-width="0.8"/>
    <!-- Intercept Crosshairs -->
    <line x1="32" y1="21" x2="32" y2="25" stroke="#FF9100" stroke-width="1.2"/>
    <line x1="32" y1="39" x2="32" y2="43" stroke="#FF9100" stroke-width="1.2"/>
    <line x1="21" y1="32" x2="25" y2="32" stroke="#FF9100" stroke-width="1.2"/>
    <line x1="39" y1="32" x2="43" y2="32" stroke="#FF9100" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="1.5" fill="#FFB454"/>
  </g>

  <!-- Typography Brand Mark (Right 90..400) -->
  <g transform="translate(90, 48)">
    <text font-family="'Sora', 'Inter', system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="7" fill="#FFFFFF">SPACI</text>
    <text x="180" y="-3" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" letter-spacing="3" fill="#00E5FF" opacity="0.9">3.0</text>
    <text x="2" y="16" font-family="'JetBrains Mono', monospace" font-weight="400" font-size="9.5" letter-spacing="2.2" fill="#7B8AA3">AUTONOMOUS DEBRIS CAPTURE SYSTEM</text>
  </g>
</svg>
